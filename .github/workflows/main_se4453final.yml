# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - se4453final

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://se4453final.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_d760a6b2f7234156a82e6dca99fcb59e }}
        password: ${{ secrets.AzureAppService_ContainerPassword_5c5538990b0146e7999c04a182c0e7ac }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: se4453final.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_d760a6b2f7234156a82e6dca99fcb59e }}/final-app:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'se4453final'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_c1e24bff84584019be87be37c391e319 }}
        images: 'se4453final.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_d760a6b2f7234156a82e6dca99fcb59e }}/final-app:${{ github.sha }}'